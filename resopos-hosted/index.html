<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>ResoPOS – Caisse restaurant</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e8590c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f2ee;--card:#fff;--tx:#1d2330;--mu:#7a8190;--br:#ebe7e0;--ac:#e8590c;--ac2:#fff0e6;--ok:#16a34a;--wa:#f59e0b;--rd:#dc2626;--sh:0 1px 2px #1d23300d,0 10px 28px -14px #1d233040;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#1a1d24;--tx:#eef0f5;--mu:#9aa1b0;--br:#2a2f39;--ac2:#35200f;--sh:0 10px 28px -14px #000}}
:root[data-theme=dark]{--bg:#0f1115;--card:#1a1d24;--tx:#eef0f5;--mu:#9aa1b0;--br:#2a2f39;--ac2:#35200f;--sh:0 10px 28px -14px #000}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}h2{font-size:22px;margin:6px 0 14px;letter-spacing:-.3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px;padding:12px 16px}
.top b{flex:1;font-size:18px;letter-spacing:-.3px}.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 110px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card);border:1px solid var(--br);border-radius:22px;box-shadow:var(--sh);display:flex;padding:4px}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mu);border-radius:16px;cursor:pointer}nav button span{display:block;font-size:20px}nav .on{color:var(--ac);background:var(--ac2);font-weight:700}
.card{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.btn{border:1px solid var(--br);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;transition:transform .08s,box-shadow .15s}.btn:active{transform:scale(.97)}.btn.p{background:linear-gradient(135deg,#f06418,#e8590c);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 16px -6px #e8590c99}.btn.g{background:linear-gradient(135deg,#22a85a,#16a34a);border-color:transparent;color:#fff;font-weight:700}.btn.d{color:var(--rd)}.btn.s{padding:6px 11px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.4}
input,select{background:var(--bg);border:1.5px solid var(--br);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:90px}.mu{color:var(--mu);font-size:13px}.r{text-align:right}
.pos{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:900px){.pos{grid-template-columns:1fr 390px}.cartbar{display:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:10px 0}.chips button{flex:none;border:1.5px solid var(--br);background:var(--card);border-radius:22px;padding:8px 16px;cursor:pointer;font-weight:500}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 6px 14px -6px #e8590c99}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.it{background:var(--card);border:1px solid var(--br);border-radius:18px;padding:8px 8px 12px;text-align:left;cursor:pointer;user-select:none;box-shadow:var(--sh);font-weight:600;line-height:1.25;transition:transform .1s}.it:active{transform:scale(.96)}.it i{height:92px;display:grid;place-items:center;background:var(--ac2);border-radius:12px;font-size:42px;font-style:normal;margin-bottom:8px}.it img{width:100%;height:92px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}.it small{display:inline-block;margin-top:6px;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 10px;font-weight:700}.it .mu{display:block}.it.off{opacity:.38;pointer-events:none}
.ln{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--br)}.ln>span:first-child{flex:1}.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--br);background:var(--bg);cursor:pointer;font-weight:700}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .T{font-size:22px;font-weight:800;border-top:2px dashed var(--br);margin-top:8px;padding-top:10px;color:var(--ac)}
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;background:linear-gradient(135deg,#f06418,#e8590c);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-weight:800;display:flex;justify-content:space-between;box-shadow:0 12px 24px -10px #e8590cbb}
.kp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.kp .card{margin:0}.kp b{font-size:24px;display:block;margin-top:4px;letter-spacing:-.5px}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,#f59e0b,#e8590c);min-width:3px}.bw{flex:1;background:var(--br);border-radius:6px}
.tag{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--ac2);color:var(--ac);font-weight:700;text-transform:capitalize}.tag.ok,.t_payee{background:#dcfce7;color:#15803d}.t_cuisine{background:#fef3c7;color:#b45309}.t_prete{background:#dbeafe;color:#1d4ed8}.t_servie{background:#ede9fe;color:#6d28d9}
.auth{max-width:440px;margin:5vh auto;padding:16px}.auth h1{margin:0 0 6px;font-size:38px;letter-spacing:-1px;background:linear-gradient(135deg,#f59e0b,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent}
.md{position:fixed;inset:0;z-index:20;background:#0009;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px}.md>div{background:var(--card);border-radius:20px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.kit{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.kit .card{margin:0;border-left:7px solid var(--wa)}.kit .late{border-left-color:var(--rd)}.kit .rdy{border-left-color:var(--ok);opacity:.7}.kit li{font-size:19px;margin:5px 0}
@media(min-width:900px){nav{left:0;right:auto;top:0;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:4px;padding:76px 8px 8px;border-radius:0;border-width:0 1px 0 0;box-shadow:none}.top,.wrap{padding-left:108px}.wrap{max-width:1300px;margin:0}.top{padding-right:20px}}
#rc{display:none}@media print{body>*:not(#rc){display:none!important}#rc{display:block;font:12px monospace;width:72mm}}
</style></style></head><body>
<div id="app"></div><div id="rc"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS={Pizzas:['🍕','Hawaiian Pizza:10,Vegetarian Delight Pizza:12,BBQ Chicken Pizza:13,Chicken & Red Onion Pizza:10,Meat & Cheese Pizza:12,Meat Eaters Pizza:13,Pepperoni Pizza:10,The Works Pizza:12,Chicken & Vegetable Pizza:13,Pepperoni & Ham Pizza:12'],
'Entrées':['🍤','Breadsticks:5,Buffalo Wings:6,Eggplant Parmigiana:8,Fried Calamari:10,Fried Mozzarella Sticks:7,Nachos:4,Tomato & Mushroom Bruschetta:6'],
Salades:['🥗','Antipasto Salad:6,Chef Salad:5,Asian Chicken Salad:8,Chicken Caesar Salad:9,Garden Salad:5,Greek Salad:8'],
'Pâtes':['🍝','Classic Carbonara Pasta:12,Penne Arrabiata Pasta:13,Shrimp Diablo Pasta:15,Spaghetti & Meatballs Pasta:12,Spaghetti Vongole:14,Truffle Chicken & Mushroom:10'],
Plats:['🥩','Carne Asada Steak:18,Chicken Piccata:20,Chicken Scampi:22,Filet Mignon:16,Fish And Chips:25,Herb Crusted Salmon Fillet:48,Herb Roasted Chicken:26,Rack Of Ribs:25,Seafood Stew:30'],
Desserts:['🍰','Original Cheesecake:5,Banana Split:6,Chocolate Fudge Cake:8,Hot Fudge Sundae:10,Salted Caramel Cheesecake:7,Strawberry Pana Cotta:4,Strawberry Shortcake:6,Tiramisu Cake:8'],
Boissons:['🥤','Coffee:3,Coke:3,Diet Coke:2,Dr. Pepper:3,Fanta:3,Hot Chocolate:3,Lemon Juice:2,Orange Juice:3,Sparkling Water:3,Sprite:3,Tea:2,Watermelon Juice:3']};
const EM={};Object.entries(CATS).forEach(([k,v])=>EM[k]=v[0]);
const seed=k=>{let i=0;return Object.entries(CATS).flatMap(([c,v])=>v[1].split(',').map(x=>{const j=x.lastIndexOf(':');return{id:'m'+(++i),c,n:x.slice(0,j),p:+x.slice(j+1)*k,a:1,ord:i}}))};
const TYPES=['Sur place','À emporter','Livraison'],METH=['Espèces','Carte','Mobile Money'],ST={cuisine:'En cuisine',prete:'Prête',servie:'Servie',payee:'Payée'};
let S={view:'pos',cat:null,q:'',cart:[],type:'Sur place',table:'',server:'',disc:0,meth:'Espèces',given:'',per:'7',db:null,sel:[]},R=null,list=[],timer;
const hash=async(p,id='')=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rp'+id+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
// ---------- stockage : db partagée si disponible, sinon navigateur ----------
const CFG=window.RESOPOS_CONFIG||{};let sb=null,ch=null,n0=-1;
async function init(){if(!CFG.url||CFG.url.includes('VOTRE')){$('#app').innerHTML='<div class="auth"><h1>Configuration requise</h1><p>Renseignez config.js (voir LISEZMOI.md).</p></div>';return}
sb=supabase.createClient(CFG.url,CFG.key);const{data}=await sb.auth.getSession();S.user=data.session?.user||null;await loadList();render();flush()}
async function loadList(){list=[];if(!S.user)return;try{const{data,error}=await sb.from('members').select('role,restaurants(id,name,data)').eq('user_id',S.user.id);if(error)throw error;list=(data||[]).filter(x=>x.restaurants);localStorage.setItem('rp_list',JSON.stringify(list))}catch(e){list=JSON.parse(localStorage.getItem('rp_list')||'[]')}}
async function openR(x){R={id:x.restaurants.id,name:x.restaurants.name,...x.restaurants.data,menu:[],orders:[]};S.role=x.role;S.view=ROLES[x.role][0];S.cat=null;await loadMenu();await loadOrders();
if(x.role==='patron'){try{const{data}=await sb.from('restaurant_codes').select('*').eq('restaurant_id',R.id).single();R.codes=data}catch(e){}await loadMembers()}listen()}
async function loadMembers(){try{const{data}=await sb.from('members').select('user_id,email,role').eq('restaurant_id',R.id);R.team=data}catch(e){}}
async function loadMenu(){try{const[a,b]=await Promise.all([sb.from('menu_items').select('data').eq('restaurant_id',R.id),sb.from('stock').select('item_id,qty').eq('restaurant_id',R.id)]);if(a.error||b.error)throw 1;const st=Object.fromEntries(b.data.map(x=>[x.item_id,x.qty]));R.menu=a.data.map(x=>({...x.data,s:st[x.data.id]??null})).sort((p,q)=>(p.ord||0)-(q.ord||0))}catch(e){}}
async function saveItem(m){const{s,...d}=m;const r=await sb.from('menu_items').upsert({restaurant_id:R.id,id:m.id,data:d}).then(x=>x,e=>({error:e}));if(r.error)toast('Enregistrement refusé ou hors ligne')}
function delItem(id){R.menu=R.menu.filter(x=>x.id!==id);sb.from('menu_items').delete().eq('restaurant_id',R.id).eq('id',id).then(r=>{if(r.error)toast('Suppression refusée')})}
async function setStock(m){const r=m.s==null?await sb.from('stock').delete().eq('restaurant_id',R.id).eq('item_id',m.id):await sb.from('stock').upsert({restaurant_id:R.id,item_id:m.id,qty:m.s});if(r.error)toast('Stock : modification refusée')}
async function adj(i,d){const r=await sb.rpc('adjust_stock',{r:R.id,item:i,delta:d}).then(x=>x,e=>({error:e}));if(r.error)queue({k:'s',i,d,n:i+Date.now()+Math.random()})}
function updO(o){sb.from('orders').update({data:o,updated_at:new Date().toISOString()}).eq('restaurant_id',R.id).eq('num',o.id).then(r=>{if(r.error)toast('Modification refusée')},()=>queue({k:'o',n:o.id,o}))}
async function loadOrders(){try{const{data,error}=await sb.from('orders').select('data').eq('restaurant_id',R.id);if(error)throw error;R.orders=data.map(r=>r.data);localStorage.setItem('rp_c_'+R.id,JSON.stringify(R))}catch(e){const c=localStorage.getItem('rp_c_'+R.id);if(c)Object.assign(R,JSON.parse(c));toast('Mode hors ligne')}}
function listen(){if(ch)sb.removeChannel(ch);n0=R.orders.filter(x=>x.st==='cuisine').length;const f='restaurant_id=eq.'+R.id,pc=(t,fl,h)=>({event:'*',schema:'public',table:t,filter:fl});
ch=sb.channel('r'+R.id).on('postgres_changes',pc('orders',f),async()=>{await loadOrders();const n=R.orders.filter(x=>x.st==='cuisine').length;if(n>n0)beep();n0=n;soft()})
.on('postgres_changes',pc('menu_items',f),async()=>{await loadMenu();soft()}).on('postgres_changes',pc('stock',f),async()=>{await loadMenu();soft()})
.on('postgres_changes',{event:'UPDATE',schema:'public',table:'restaurants',filter:'id=eq.'+R.id},p=>{if(p.new.data){Object.assign(R,{name:p.new.name},p.new.data);soft()}}).subscribe()}
const Q=()=>JSON.parse(localStorage.getItem('rp_q')||'[]'),setQ=q=>localStorage.setItem('rp_q',JSON.stringify(q));
function queue(op){op.rid=R.id;setQ([...Q().filter(x=>!(x.k===op.k&&x.rid===op.rid&&x.n===op.n)),op]);toast('Hors ligne : enregistré, synchronisation au retour du réseau')}
async function flush(){if(!sb||!navigator.onLine)return;for(const op of Q()){try{let r;if(op.k==='o')r=await sb.from('orders').upsert({restaurant_id:op.rid,num:op.n,data:op.o});else if(op.k==='d')r=await sb.from('orders').delete().eq('restaurant_id',op.rid).eq('num',op.n);else if(op.k==='s')r=await sb.rpc('adjust_stock',{r:op.rid,item:op.i,delta:op.d});else if(R&&R.id===op.rid){const{cur,tax,staff}=R;r=await sb.from('restaurants').update({name:R.name,data:{cur,tax,staff}}).eq('id',op.rid)}if(r&&r.error)throw r.error;setQ(Q().filter(x=>JSON.stringify(x)!==JSON.stringify(op)))}catch(e){return}}}
function save(){if(S.role!=='patron')return;clearTimeout(timer);timer=setTimeout(async()=>{const{cur,tax,staff}=R;try{localStorage.setItem('rp_c_'+R.id,JSON.stringify(R))}catch(e){}let r;try{r=await sb.from('restaurants').update({name:R.name,data:{cur,tax,staff}}).eq('id',R.id)}catch(e){r={error:e}}if(r.error)queue({k:'r'})},300)}
function saveO(o){sb.from('orders').upsert({restaurant_id:R.id,num:o.id,data:o}).then(r=>{if(r.error)queue({k:'o',n:o.id,o})},()=>queue({k:'o',n:o.id,o}))}
function delO(id){R.orders=R.orders.filter(x=>x.id!==id);sb.from('orders').delete().eq('restaurant_id',R.id).eq('num',id).then(r=>{if(r.error)queue({k:'d',n:id})},()=>queue({k:'d',n:id}))}
async function nextNum(){try{const{data,error}=await sb.rpc('next_num',{r:R.id});if(error)throw error;return data}catch(e){return Math.floor(Date.now()/1000)}}
addEventListener('online',()=>{if(R){save();flush()}});
const soft=()=>{const t=document.activeElement?.tagName;if(!/INPUT|SELECT/.test(t)&&!S.split)render()};
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},250)}catch(e){}};
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99';document.body.append(t);setTimeout(()=>t.remove(),2200)};
const fmt=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:R.cur,maximumFractionDigits:R.cur==='XOF'?0:2}).format(n||0);
const calc=(its,d)=>{const sub=its.reduce((a,i)=>a+i.q*i.p,0),base=Math.max(0,sub-d),tax=base*R.tax/100;return{sub,tax,total:base+tax}};
// ---------- vues ----------
function render(){if(R&&!S.cat)S.cat=R.menu[0]?.c;$('#app').innerHTML=R?shell():auth()}
function auth(){const u=S.user;return`<div class="auth"><h1>🍽️ ResoPOS</h1>${!u?`<p class="mu">Connectez-vous pour accéder à vos restaurants.</p><div class="card" style="display:grid;gap:8px"><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password"><div class="row"><button class="btn p" data-a="signin">Connexion</button><button class="btn" data-a="signup">Créer un compte</button></div><button class="btn s" data-a="reset">Mot de passe oublié ?</button></div>`:`<p class="mu">${esc(u.email)} · <a data-a="signout" style="cursor:pointer;color:var(--ac)">Déconnexion</a></p>${list.length?`<div class="card"><b>Mes restaurants</b>${list.map((x,i)=>`<div class="row" style="margin-top:8px"><b style="flex:2">${esc(x.restaurants.name)}</b><span class="tag">${x.role}</span><button class="btn p" data-a="open" data-id="${i}">Ouvrir</button></div>`).join('')}</div>`:''}
<div class="card"><b>Créer un restaurant</b><div style="display:grid;gap:8px;margin-top:8px"><input id="nn" placeholder="Nom du restaurant"><div class="row"><select id="nc"><option value="XOF">FCFA (XOF)</option><option value="EUR">Euro (EUR)</option><option value="USD">Dollar (USD)</option></select><input id="nt" type="number" value="18" placeholder="TVA %"></div><button class="btn p" data-a="create">Créer et ouvrir</button></div></div>
<div class="card"><b>Rejoindre une équipe</b><div class="row" style="margin-top:8px"><input id="jc" placeholder="Code d’invitation"><button class="btn" data-a="join">Rejoindre</button></div></div>`}</div>`}
const ROLES={patron:['pos','kit','orders','menu','dash','set'],caisse:['pos','kit','orders'],cuisine:['kit']};
function shell(){const V={pos:['🧾','Caisse'],kit:['👨‍🍳','Cuisine'],orders:['📋','Commandes'],menu:['🍴','Menu'],dash:['📊','Bilan'],set:['⚙️','Réglages']},ok=ROLES[S.role]||[];if(!ok.includes(S.view))S.view=ok[0];
return`<div class="top"><b>🍽️ ${esc(R.name)}</b><span class="tag">${S.role}</span><button class="btn s" data-a="logout">Quitter</button></div><div class="wrap">${{pos,kit,orders,menu,dash,set}[S.view]()}</div><nav>${ok.map(k=>`<button class="${S.view===k?'on':''}" data-a="v" data-id="${k}"><span>${V[k][0]}</span>${V[k][1]}</button>`).join('')}</nav>${S.split?splitM():''}`}
function pos(){const cats=[...new Set(R.menu.map(m=>m.c))],q=S.q.toLowerCase(),its=R.menu.filter(m=>(q?m.n.toLowerCase().includes(q):m.c===S.cat)),c=calc(S.cart,S.disc),n=S.cart.reduce((a,i)=>a+i.q,0);
return`<div class="pos"><div><input id="sq" placeholder="🔍 Rechercher un plat…" value="${esc(S.q)}"><div class="chips">${cats.map(k=>`<button class="${k===S.cat&&!q?'on':''}" data-a="cat" data-id="${esc(k)}">${EM[k]||'🍴'} ${esc(k)}</button>`).join('')}</div>
<div class="grid">${its.map(m=>`<div class="it ${m.a&&(m.s==null||m.s>0)?'':'off'}" data-a="add" data-id="${m.id}">${m.img?`<img src="${m.img}">`:`<i>${EM[m.c]||'🍴'}</i>`}${esc(m.n)}<small>${fmt(m.p)}</small>${m.s!=null?`<span class="mu">${m.s>0?'Reste '+m.s:'Épuisé'}</span>`:''}</div>`).join('')||'<p class="mu">Aucun article. Ajoutez-en dans l’onglet Menu.</p>'}</div></div>
<div class="card" id="cart" style="align-self:start;position:sticky;top:64px"><div class="row"><select data-c="type">${TYPES.map(t=>`<option ${t===S.type?'selected':''}>${t}</option>`).join('')}</select><input data-c="table" placeholder="Table / adresse" value="${esc(S.table)}"><select data-c="server"><option value="">Serveur</option>${R.staff.map(s=>`<option ${s===S.server?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
<div style="margin:8px 0">${S.cart.map((i,x)=>`<div class="ln"><span>${esc(i.n)}<br><span class="mu">${fmt(i.p)}</span></span><span class="q"><button data-a="dec" data-id="${x}">−</button><b>${i.q}</b><button data-a="inc" data-id="${x}">+</button></span><b style="min-width:70px" class="r">${fmt(i.q*i.p)}</b></div>`).join('')||'<p class="mu">Panier vide — touchez un plat pour l’ajouter.</p>'}</div>
<div class="tot"><div><span>Sous-total</span><span>${fmt(c.sub)}</span></div><div><span>Remise</span><input data-c="disc" type="number" min="0" value="${S.disc||''}" style="width:90px;padding:4px 8px"></div><div><span>TVA ${R.tax}%</span><span>${fmt(c.tax)}</span></div><div class="T"><span>Total</span><span>${fmt(c.total)}</span></div></div>
<div class="row" style="margin-top:10px"><select data-c="meth">${METH.map(t=>`<option ${t===S.meth?'selected':''}>${t}</option>`).join('')}</select>${S.meth==='Espèces'?`<input data-c="given" type="number" placeholder="Montant reçu" value="${S.given}">`:''}</div>
${S.meth==='Espèces'&&S.given?`<p class="mu">Monnaie à rendre : <b>${fmt(Math.max(0,S.given-c.total))}</b></p>`:''}
<div class="row" style="margin-top:8px"><button class="btn" data-a="kitchen" ${n?'':'disabled'}>👨‍🍳 Cuisine</button><button class="btn g" data-a="pay" ${n?'':'disabled'}>Encaisser</button><button class="btn d" data-a="clear" ${n?'':'disabled'}>Vider</button></div></div></div>
${n?`<button class="cartbar" data-a="goc"><span>🛒 ${n} article(s)</span><span>${fmt(c.total)}</span></button>`:''}`}
function kit(){const o=R.orders.filter(x=>x.st==='cuisine'||x.st==='prete').sort((a,b)=>a.t-b.t);
return`<h2>Écran cuisine (${o.filter(x=>x.st==='cuisine').length} à préparer)</h2><div class="kit">${o.map(x=>{const m=Math.round((Date.now()-x.t)/6e4);return`<div class="card ${x.st==='prete'?'rdy':m>15?'late':''}"><div class="row"><b style="font-size:20px">N° ${x.id}</b><span class="tag">${esc(x.type)}${x.table?' · '+esc(x.table):''}</span><b class="r">${m} min</b></div><ul style="padding-left:20px">${x.items.map(i=>`<li><b>${i.q}×</b> ${esc(i.n)}</li>`).join('')}</ul><button class="btn ${x.st==='prete'?'':'g'}" style="width:100%" data-a="st" data-id="${x.id}">${x.st==='prete'?'Servie ✓':'Prête ✓'}</button></div>`}).join('')||'<p class="mu">Aucune commande en cours. Les nouveaux tickets apparaissent ici automatiquement.</p>'}</div>`}
function orders(){const o=[...R.orders].sort((a,b)=>b.t-a.t);return`<div class="row"><h2 style="flex:3">Commandes (${o.length})</h2>${S.sel.length>1?`<button class="btn p" data-a="merge">🔗 Fusionner (${S.sel.length})</button>`:''}</div>${o.map(x=>`<div class="card"><div class="row">${x.st!=='payee'?`<input type="checkbox" style="flex:0 0 22px;min-width:22px" data-a="sel" data-id="${x.id}" ${S.sel.includes(x.id)?'checked':''}>`:''}<b style="flex:2">N° ${x.id} · ${esc(x.type)}${x.table?' · '+esc(x.table):''}</b><span class="tag t_${x.st}">${ST[x.st]}</span><b class="r">${fmt(x.total)}</b></div><div class="mu">${new Date(x.t).toLocaleString('fr-FR')} · ${esc(x.server||'—')} · ${x.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</div><div class="row" style="margin-top:8px"><button class="btn s" data-a="rcp" data-id="${x.id}">🖨️ Ticket</button>${x.st==='cuisine'||x.st==='prete'?`<button class="btn s" data-a="st" data-id="${x.id}">${x.st==='cuisine'?'Prête':'Servie'}</button>`:''}${x.st!=='payee'?`<button class="btn s" data-a="split" data-id="${x.id}">✂️ Diviser</button><button class="btn s g" data-a="spay" data-id="${x.id}">Encaisser</button>`:''}${x.st!=='payee'||S.role==='patron'?`<button class="btn s d" data-a="delo" data-id="${x.id}">Annuler</button>`:''}</div></div>`).join('')||'<p class="mu">Aucune commande pour l’instant.</p>'}`}
function splitM(){const o=R.orders.find(x=>x.id===S.split);if(!o)return'';return`<div class="md"><div><b>Diviser la commande N° ${o.id}</b><p class="mu">Quantités à déplacer vers une nouvelle commande :</p>${o.items.map((i,x)=>`<div class="ln"><span>${esc(i.n)} <span class="mu">(${i.q})</span></span><input type="number" min="0" max="${i.q}" value="0" data-sp="${x}" style="width:70px"></div>`).join('')}<button class="btn p" style="width:100%;margin:10px 0" data-a="dosplit">Créer la nouvelle commande</button><div class="row"><input id="eqn" type="number" min="2" value="2"><button class="btn" data-a="eq">÷ Parts égales</button></div><p id="eqr" class="mu"></p><button class="btn" style="width:100%" data-a="closesplit">Fermer</button></div></div>`}
function menu(){return`<h2>Menu (${R.menu.length} articles)</h2><input type="file" id="ph" accept="image/*" hidden><div class="card"><div class="row"><input id="mn" placeholder="Nom du plat"><input id="mc" list="cl" placeholder="Catégorie"><datalist id="cl">${[...new Set(R.menu.map(m=>m.c))].map(c=>`<option>${esc(c)}`).join('')}</datalist><input id="mp" type="number" placeholder="Prix"><button class="btn p" data-a="madd">Ajouter</button></div></div>
${R.menu.map(m=>`<div class="card row" style="padding:10px"><span style="flex:3">${m.img?`<img src="${m.img}" style="width:34px;height:34px;border-radius:8px;vertical-align:middle;object-fit:cover">`:EM[m.c]||'🍴'} ${esc(m.n)}<br><span class="mu">${esc(m.c)}${m.s!=null?` · stock : <b style="color:${m.s<=5?'var(--rd)':'inherit'}">${m.s}</b>`:''}</span></span><b>${fmt(m.p)}</b><button class="btn s" data-a="mp" data-id="${m.id}">Prix</button><button class="btn s" data-a="ms" data-id="${m.id}">📦</button><button class="btn s" data-a="mimg" data-id="${m.id}">📷</button><button class="btn s" data-a="mt" data-id="${m.id}">${m.a?'Dispo':'Épuisé'}</button><button class="btn s d" data-a="md" data-id="${m.id}">✕</button></div>`).join('')}`}
function dash(){const lim=S.per==='1'?new Date().setHours(0,0,0,0):S.per==='7'?Date.now()-6048e5:0,o=R.orders.filter(x=>x.st==='payee'&&x.t>=lim),sum=a=>a.reduce((s,x)=>s+x.total,0),tot=sum(o),by={},cat={},top={};
o.forEach(x=>{by[x.meth]=(by[x.meth]||0)+x.total;x.items.forEach(i=>{const c=R.menu.find(m=>m.n===i.n)?.c||'Autre';cat[c]=(cat[c]||0)+i.q*i.p;top[i.n]=(top[i.n]||0)+i.q})});
const bars=(ob,f)=>{const e=Object.entries(ob).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><span style="flex:0 0 130px;min-width:0" class="mu">${esc(k)}</span><div class="bw"><div class="bar" style="width:${v/mx*100}%"></div></div><b style="flex:0 0 90px" class="r">${f(v)}</b></div>`).join('')||'<p class="mu">Pas encore de données.</p>'};
return`<div class="row"><h2 style="flex:3">Bilan des ventes</h2><select data-c="per"><option value="1" ${S.per==='1'?'selected':''}>Aujourd’hui</option><option value="7" ${S.per==='7'?'selected':''}>7 jours</option><option value="0" ${S.per==='0'?'selected':''}>Tout</option></select></div>
<div class="kp"><div class="card mu">💰 Chiffre d’affaires<b style="color:var(--tx)">${fmt(tot)}</b></div><div class="card mu">🧾 Commandes payées<b style="color:var(--tx)">${o.length}</b></div><div class="card mu">🎯 Ticket moyen<b style="color:var(--tx)">${fmt(o.length?tot/o.length:0)}</b></div><div class="card mu">🏛️ TVA collectée<b style="color:var(--tx)">${fmt(o.reduce((s,x)=>s+x.tax,0))}</b></div></div>
<div class="card" style="margin-top:12px"><b>Par catégorie</b>${bars(cat,fmt)}</div><div class="card"><b>Articles les plus vendus</b>${bars(top,v=>v+' ×')}</div><div class="card"><b>Modes de paiement</b>${bars(by,fmt)}</div><div class="card"><b>⚠️ Stock bas (≤ 5)</b>${R.menu.filter(m=>m.s!=null&&m.s<=5).map(m=>`<div class="ln"><span>${esc(m.n)}</span><b style="color:var(--rd)">${m.s}</b></div>`).join('')||'<p class="mu">Rien à signaler. Activez le suivi avec le bouton 📦 dans Menu.</p>'}</div>`}
function set(){return`<h2>Réglages</h2><div class="card"><b>Équipe / serveurs</b><div class="row" style="margin:8px 0"><input id="sn" placeholder="Nom du serveur"><button class="btn p" data-a="sadd">Ajouter</button></div>${R.staff.map((s,i)=>`<span class="tag" style="margin-right:6px">${esc(s)} <a data-a="sdel" data-id="${i}" style="cursor:pointer">✕</a></span>`).join('')||'<span class="mu">Aucun serveur.</span>'}</div>
${R.team?`<div class="card"><b>Équipe et droits</b><p class="mu">Patron : tout. Caisse : ventes, commandes, stock vendu. Cuisine : écran cuisine seulement.</p>${R.team.map(t=>`<div class="ln"><span>${esc(t.email||'—')}</span>${t.user_id===S.user.id?'<span class="tag">vous</span>':`<select data-mr="${t.user_id}" style="width:120px">${['patron','caisse','cuisine'].map(r=>`<option ${r===t.role?'selected':''}>${r}</option>`).join('')}</select><button class="btn s d" data-a="mdel" data-id="${t.user_id}">✕</button>`}</div>`).join('')}</div>`:''}${R.codes?`<div class="card"><b>Inviter l’équipe</b><p class="mu">Donnez le code à la personne : elle crée son compte, puis choisit « Rejoindre une équipe ».</p><div class="ln"><span>Caisse</span><b>${esc(R.codes.caisse)}</b></div><div class="ln"><span>Cuisine</span><b>${esc(R.codes.cuisine)}</b></div></div>`:''}<div class="card"><b>Taxe</b><div class="row" style="margin-top:8px"><input id="tx" type="number" value="${R.tax}"><button class="btn" data-a="tax">Enregistrer le taux (%)</button></div></div>
<div class="card"><b>Données</b><div class="row" style="margin-top:8px"><button class="btn" data-a="csv">⬇️ Exporter les commandes (CSV)</button><button class="btn" data-a="theme">🌓 Thème</button></div><p class="mu">Astuce : sur mobile, ajoutez cette page à l’écran d’accueil pour l’utiliser comme une application.</p></div>`}
// ---------- actions ----------
function receipt(x){$('#rc').innerHTML=`<center><b>${esc(R.name)}</b><br>Ticket N° ${x.id}<br>${new Date(x.t).toLocaleString('fr-FR')}</center><hr>${x.items.map(i=>`${i.q}× ${esc(i.n)}<span style="float:right">${fmt(i.q*i.p)}</span><br>`).join('')}<hr>Sous-total<span style="float:right">${fmt(x.sub)}</span><br>Remise<span style="float:right">-${fmt(x.disc)}</span><br>TVA ${R.tax}%<span style="float:right">${fmt(x.tax)}</span><br><b>TOTAL<span style="float:right">${fmt(x.total)}</span></b><br>${x.st==='payee'?'Payé : '+esc(x.meth):'À payer'}<br><center>Merci de votre visite !</center>`;setTimeout(()=>print(),50)}
async function place(st){if(S.busy)return;S.busy=1;try{const c=calc(S.cart,S.disc),id=await nextNum();const o={id,t:Date.now(),type:S.type,table:S.table,server:S.server,items:S.cart.map(i=>({...i})),disc:+S.disc||0,sub:c.sub,tax:c.tax,total:c.total,meth:S.meth,st};R.orders.push(o);S.cart.forEach(i=>{const m=R.menu.find(x=>x.n===i.n);if(m&&m.s!=null){m.s=Math.max(0,m.s-i.q);adj(m.id,-i.q)}});saveO(o);S.cart=[];S.table='';S.disc=0;S.given='';render();toast('Commande N° '+id+(st==='payee'?' encaissée':' envoyée en cuisine'));if(st==='payee')receipt(o)}finally{S.busy=0}}
function photo(inp){const f=inp.files[0],m=R.menu.find(x=>x.id===S.ph);if(!f||!m)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=480;c.height=360;const x=c.getContext('2d'),r=Math.max(480/im.width,360/im.height);x.drawImage(im,(480-im.width*r)/2,(360-im.height*r)/2,im.width*r,im.height*r);
c.toBlob(async b=>{toast('Envoi de la photo…');const path=R.id+'/'+m.id+'.jpg',u=await sb.storage.from('menu-photos').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(u.error)return toast('Envoi impossible : '+u.error.message);m.img=sb.storage.from('menu-photos').getPublicUrl(path).data.publicUrl+'?v='+Date.now();await saveItem(m);render()},'image/jpeg',.8)};im.src=URL.createObjectURL(f);inp.value=''}
setInterval(()=>{if(R&&S.view==='kit')soft()},30000);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();
</script></body></html>
